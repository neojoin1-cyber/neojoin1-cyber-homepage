name: Recover transient job source connection
on:
  workflow_run:
    workflows: [Update vocational job feed]
    types: [completed]
permissions:
  actions: write
jobs:
  retry:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.run_attempt < 3 &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Retry only connectivity gates on a fresh cloud runner
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          failed=$(gh api "repos/${GH_REPO}/actions/runs/${RUN_ID}/jobs" --jq '[.jobs[].steps[] | select(.conclusion == "failure") | .name]')
          if ! echo "$failed" | jq -e 'length > 0 and all(. == "Official source preflight" or . == "Verify primary source freshness")' >/dev/null; then
            echo "Not a connectivity-only failure; preserve the failure for operator review."
            exit 0
          fi
          echo "Transient source gate failed. Retry on a fresh runner after backoff (maximum three attempts total)."
          sleep 60
          gh run rerun "$RUN_ID" --failed
