name: Update vocational job feed

on:
  schedule:
    # 09:10, 14:10, 23:10 KST
    - cron: "10 0,5,14 * * *"
    # Backup checks 30 minutes later in case an external source was slow or transiently unavailable.
    - cron: "40 0,5,14 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/job-feed.yml"
      - "tools/fetch_vocational_jobs.mjs"
      - "tools/student_job_eligibility.mjs"
      - "tools/student_job_eligibility.test.mjs"
      - "tools/reviewed_job_evidence.mjs"
      - "tools/extract_job_attachment.test.py"
      - "tools/extract_job_attachment.py"
      - "tools/job_source_gate.mjs"
      - "tools/job_source_gate.test.mjs"
      - "tools/job_collection_audit.mjs"
      - "tools/job_collection_audit.test.mjs"
      - "tools/priority_job_discovery.mjs"
      - "tools/priority_job_discovery.test.mjs"
      - "tools/employer_notice_resolver.mjs"
      - "tools/job_attachment_audit.mjs"
      - "tools/job_attachment_cache.mjs"
      - "tools/job_attachment_cache.test.mjs"
      - "tools/employer_notice_resolver.test.mjs"
      - "assets/job-official-links.mjs"
      - "assets/job-attachments.mjs"
      - "tools/verify_platform_reliability.mjs"
      - "index.html"
      - "docs/JOB_FEED_AUTOMATION.md"
      - "docs/JOB_FEED_SECRET_SETUP_SIMPLE.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vocational-job-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Check job feed script syntax
        run: node --check tools/fetch_vocational_jobs.mjs

      - name: Record collection start
        run: node -e "require('fs').appendFileSync(process.env.GITHUB_ENV, 'JOB_FEED_RUN_STARTED_AT=' + new Date().toISOString() + '\n')"

      - name: Verify source gate regressions
        run: node --test tools/job_source_gate.test.mjs tools/job_collection_audit.test.mjs tools/priority_job_discovery.test.mjs tools/employer_notice_resolver.test.mjs tools/job_attachment_cache.test.mjs

      - name: Official source preflight
        continue-on-error: true
        run: node tools/job_source_gate.mjs preflight

      - name: Verify student eligibility regressions
        run: node --test tools/student_job_eligibility.test.mjs

      - name: Use Python for official attachments
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF text reader
        run: python -m pip install 'pypdf==6.14.2'

      - name: Verify bounded attachment extraction
        run: python tools/extract_job_attachment.test.py

      - name: Build official API job feed
        run: node tools/fetch_vocational_jobs.mjs
        env:
          JOB_FEED_AI_DISABLED: "1"
          WORK24_AUTH_KEY: ${{ secrets.WORK24_AUTH_KEY }}
          WORKNET_AUTH_KEY: ${{ secrets.WORKNET_AUTH_KEY }}
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          MPM_PUBLIC_JOB_SERVICE_KEY: ${{ secrets.MPM_PUBLIC_JOB_SERVICE_KEY }}
          MPM_PUBLIC_JOB_API_URL: ${{ secrets.MPM_PUBLIC_JOB_API_URL }}
          MOEF_PUBLIC_RECRUIT_SERVICE_KEY: ${{ secrets.MOEF_PUBLIC_RECRUIT_SERVICE_KEY }}
          SARAMIN_ACCESS_KEY: ${{ secrets.SARAMIN_ACCESS_KEY }}
          JOB_ALIO_API_KEY: ${{ secrets.JOB_ALIO_API_KEY }}
          JOB_ALIO_API_URL: ${{ secrets.JOB_ALIO_API_URL }}
          JOB_ALIO_EXTRA_WATCH_ORGS: ${{ secrets.JOB_ALIO_EXTRA_WATCH_ORGS }}
          NARAILTER_API_KEY: ${{ secrets.NARAILTER_API_KEY }}
          NARAILTER_API_URL: ${{ secrets.NARAILTER_API_URL }}
          MILITARY_RECRUIT_API_KEY: ${{ secrets.MILITARY_RECRUIT_API_KEY }}
          MILITARY_RECRUIT_API_URL: ${{ secrets.MILITARY_RECRUIT_API_URL }}
          JOBKOREA_API_KEY: ${{ secrets.JOBKOREA_API_KEY }}
          JOBKOREA_API_URL: ${{ secrets.JOBKOREA_API_URL }}
          INCRUIT_API_KEY: ${{ secrets.INCRUIT_API_KEY }}
          INCRUIT_API_URL: ${{ secrets.INCRUIT_API_URL }}
          ALBAMON_API_KEY: ${{ secrets.ALBAMON_API_KEY }}
          ALBAMON_API_URL: ${{ secrets.ALBAMON_API_URL }}
          ALBA_API_KEY: ${{ secrets.ALBA_API_KEY }}
          ALBA_API_URL: ${{ secrets.ALBA_API_URL }}
          JOBABA_API_KEY: ${{ secrets.JOBABA_API_KEY }}
          JOBABA_API_URL: ${{ secrets.JOBABA_API_URL }}
          EDU_JOB_CENTER_FEEDS: ${{ secrets.EDU_JOB_CENTER_FEEDS }}
          FINANCE_RECRUIT_FEEDS: ${{ secrets.FINANCE_RECRUIT_FEEDS }}
          LARGE_COMPANY_RECRUIT_FEEDS: ${{ secrets.LARGE_COMPANY_RECRUIT_FEEDS }}
          FINANCE_RECRUIT_API_KEY: ${{ secrets.FINANCE_RECRUIT_API_KEY }}
          LARGE_COMPANY_RECRUIT_API_KEY: ${{ secrets.LARGE_COMPANY_RECRUIT_API_KEY }}
          NONPROFIT_RECRUIT_API_KEY: ${{ secrets.NONPROFIT_RECRUIT_API_KEY }}
          NONPROFIT_RECRUIT_API_URL: ${{ secrets.NONPROFIT_RECRUIT_API_URL }}

      - name: Preserve public collection diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-collection-diagnostics
          path: |
            assets/job-collection-audit.json
            assets/job-priority-coverage.json
            assets/job-feed-health.json
            assets/job-feed.json
          retention-days: 7

      - name: Verify platform reliability gate
        run: node tools/verify_platform_reliability.mjs

      - name: Verify primary source freshness
        run: node tools/job_source_gate.mjs freshness

      - name: Verify collection reconciliation
        run: node tools/job_source_gate.mjs reconciliation

      - name: Commit updated feed
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          if ! git diff --quiet HEAD FETCH_HEAD -- tools/fetch_vocational_jobs.mjs tools/student_job_eligibility.mjs tools/reviewed_job_evidence.mjs tools/extract_job_attachment.py tools/job_collection_audit.mjs tools/job_source_gate.mjs tools/priority_job_discovery.mjs tools/employer_notice_resolver.mjs tools/job_attachment_audit.mjs tools/job_attachment_cache.mjs assets/job-official-links.mjs assets/job-attachments.mjs; then
            echo "::warning::Collector rules changed during this run. Do not publish results from the older engine."
            exit 0
          fi
          if [ -z "$(git status --short -- assets/job-feed.json assets/job-detail-vault.json assets/job-feed-health.json assets/job-collection-audit.json assets/job-priority-coverage.json assets/job-attachment-files)" ]; then
            echo "No job feed, health, or attachment changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/job-feed.json
          git add assets/job-detail-vault.json
          git add assets/job-feed-health.json
          git add assets/job-collection-audit.json
          git add assets/job-priority-coverage.json
          if [ -d assets/job-attachment-files ]; then
            git add assets/job-attachment-files
          fi
          git commit -m "Update vocational job feed"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "::warning::Job feed push was rejected, likely because another feed run published first. Rebasing and retrying (${attempt}/3)."
            git fetch origin "${GITHUB_REF_NAME}"
            if ! git diff --quiet HEAD FETCH_HEAD -- tools/fetch_vocational_jobs.mjs tools/student_job_eligibility.mjs tools/reviewed_job_evidence.mjs tools/extract_job_attachment.py tools/job_collection_audit.mjs tools/job_source_gate.mjs tools/priority_job_discovery.mjs tools/employer_notice_resolver.mjs tools/job_attachment_audit.mjs tools/job_attachment_cache.mjs assets/job-official-links.mjs assets/job-attachments.mjs; then
              echo "::warning::Newer collector rules exist. Discard this obsolete publication attempt."
              exit 0
            fi
            if git rebase "origin/${GITHUB_REF_NAME}"; then
              continue
            fi
            git rebase --abort || true
            echo "::warning::Concurrent feed changes could not be rebased cleanly. Another run already published a newer feed, so this run will not be marked failed."
            exit 0
          done
          git push

      - name: Commit automation health diagnostics
        if: failure()
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          if ! git diff --quiet HEAD FETCH_HEAD -- tools/fetch_vocational_jobs.mjs tools/student_job_eligibility.mjs tools/reviewed_job_evidence.mjs tools/extract_job_attachment.py tools/job_collection_audit.mjs tools/job_source_gate.mjs tools/priority_job_discovery.mjs tools/employer_notice_resolver.mjs tools/job_attachment_audit.mjs tools/job_attachment_cache.mjs assets/job-official-links.mjs assets/job-attachments.mjs; then
            echo "::warning::Obsolete run: preserve the newer engine's health diagnostics."
            exit 0
          fi
          node tools/record_job_publication_hold.mjs
          if [ -z "$(git status --short -- assets/job-feed-health.json)" ]; then
            echo "No automation health diagnostics to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/job-feed-health.json
          git commit -m "Record job feed automation diagnostics"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "::warning::Diagnostics push was rejected, likely because another run published first. Rebasing and retrying (${attempt}/3)."
            git fetch origin "${GITHUB_REF_NAME}"
            if ! git diff --quiet HEAD FETCH_HEAD -- tools/fetch_vocational_jobs.mjs tools/student_job_eligibility.mjs tools/reviewed_job_evidence.mjs tools/extract_job_attachment.py tools/job_collection_audit.mjs tools/job_source_gate.mjs tools/priority_job_discovery.mjs tools/employer_notice_resolver.mjs tools/job_attachment_audit.mjs tools/job_attachment_cache.mjs assets/job-official-links.mjs assets/job-attachments.mjs; then
              echo "::warning::Do not replace health diagnostics from a newer collector."
              exit 0
            fi
            if git rebase "origin/${GITHUB_REF_NAME}"; then
              continue
            fi
            git rebase --abort || true
            echo "::warning::Concurrent diagnostics changes could not be rebased cleanly. Leaving this run successful to avoid a false automation failure."
            exit 0
          done
          git push
