  <style>
    html, body { height: 100%; }
    body { margin: 0; overflow: hidden; }
    .profile-shell {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      height: 100%;
      min-height: 100dvh;
      background: #f7f4ec;
    }
    .profile-stage {
      position: relative;
      min-height: 0;
      border-top: 1px solid rgba(19, 42, 74, .12);
      background: #f4f7fb;
    }
    .profile-stage iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }
    .profile-fallback {
      position: absolute;
      right: 18px;
      bottom: 18px;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      min-height: 42px;
      padding: 0 16px;
      border: 1px solid rgba(19, 42, 74, .16);
      border-radius: 999px;
      background: rgba(255, 255, 255, .94);
      color: #132a4a;
      font-weight: 800;
      box-shadow: 0 10px 30px rgba(19, 42, 74, .12);
    }
    @media (max-width: 760px) {
      .profile-shell { height: auto; min-height: 100dvh; }
      .profile-stage { height: calc(100dvh - 190px); min-height: 620px; }
      .profile-fallback { right: 12px; bottom: 12px; }
    }
  </style>
</head>
